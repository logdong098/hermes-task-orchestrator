[metadata]
name = hermes
version = 0.1.0
description = Telegram Director and distributed Worker orchestration for Hermes Agent
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    fastapi>=0.115,<1
    httpx>=0.27,<1
    pydantic>=2.9,<3
    uvicorn>=0.30,<1

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8,<9
    ruff>=0.9,<1

[options.entry_points]
console_scripts =
    hermes-coordinator = hermes.coordinator:main
    hermes-worker = hermes.worker:main
    hermes-gateway-worker = hermes.gateway_worker:main
    hermes-telegram = hermes.telegram_bot:main
