# 当前 MVP 以环境变量为唯一运行时配置源；本文件用于展示完整配置结构。
# 字段与 .env.example 一一对应，后续可由配置适配器直接加载。
coordinator:
  database_path: data/hermes.db
  director_api_key: ${HERMES_DIRECTOR_API_KEY}
  worker_shared_secret: ${HERMES_WORKER_SHARED_SECRET}
  worker_secrets: {}
  worker_stale_seconds: 45
  task_lease_seconds: 30
  hmac_max_clock_skew_seconds: 300
  default_task_timeout_seconds: 900
  max_task_timeout_seconds: 7200
  default_max_attempts: 2
  maintenance_interval_seconds: 5
  planner:
    default_agent: codex
    commands:
      claude: [claude, --permission-mode, plan, -p, "{prompt}"]
      codex: [codex, exec, --sandbox, read-only, "{prompt}"]
    timeout_seconds: 900
    poll_interval_seconds: 2
    lease_seconds: 30
    max_attempts: 2
    max_output_bytes: 2000000

worker:
  coordinator_url: http://127.0.0.1:8000
  id: macbook-worker-01
  name: MacBook Worker 01
  command: [hermes, chat, -q, "{prompt}"]
  default_agent: default
  agent_commands: {}
  allowed_workdir: /absolute/path/to/allowed/workspace
  concurrency: 1
  task_timeout_seconds: 900
  heartbeat_interval_seconds: 10
  poll_interval_seconds: 2

# M1 无 GUI Gateway Worker；与普通 worker 分开运行并使用不同 worker id。
gateway_worker:
  coordinator_url: http://127.0.0.1:8000
  id: hermes-gateway-worker-01
  name: Hermes Gateway Worker 01
  gateway_url: http://127.0.0.1:8642
  gateway_id: local-hermes
  gateway_kind: local
  gateway_token: ${HERMES_GATEWAY_TOKEN}
  # 不要把真实 key 提交到仓库；生产环境使用受限 env/secret file。
  profile_keys: {}
  profiles: [default]
  default_profile: default
  default_agent: hermes
  concurrency: 1
  task_timeout_seconds: 900
  heartbeat_interval_seconds: 10
  poll_interval_seconds: 2
  gateway_poll_interval_seconds: 2
  gateway_request_timeout_seconds: 30
  gateway_stop_wait_seconds: 30

telegram:
  enabled: false
  bot_token: ${HERMES_TELEGRAM_BOT_TOKEN}
  allowed_user_ids: [123456789]
  coordinator_url: http://127.0.0.1:8000
  director_api_key: ${HERMES_DIRECTOR_API_KEY}
  poll_timeout_seconds: 25
  notification_interval_seconds: 3
  offset_path: data/telegram.offset
